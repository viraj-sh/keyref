name: Scraper

env:
  DRY_RUN: true

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours (change as needed)
  workflow_dispatch:        # allow manual run

permissions:
  contents: write   # needed so the workflow can push changes

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Install dependencies
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      # Run your scraper
      - name: Run scraper
        run: |
          python scraper.py

      # Commit and push data updates
      - name: Commit changes
        if: env.DRY_RUN != 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
      
          git add data
          if git diff --cached --quiet; then
              echo "No changes."
          else
              git commit -m "Scraper update (DRY RUN test)"
              git push
          fi

name: Scraper

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours (change as needed)
  workflow_dispatch: # allow manual run

permissions:
  contents: write # needed so the workflow can push changes

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    environment: commit-approval

    steps:
      # Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Install dependencies
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      # Run your scraper
      - name: Run scraper
        run: |
          python scraper.py

      # Discard changes to specific files
      - name: Reset ignored files
        run: |
          git checkout -- data/cheatsheet/ableton-live-9-win.json

      # Commit and push data updates
      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add data
          if git diff --cached --quiet; then
              echo "No changes."
          else
              git commit -m "Scraper update (DRY RUN test)"
              git push
          fi
